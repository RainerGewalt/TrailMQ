# TrailMQ Recipe metadata
# Consumed by the CLI to describe the recipe in the launcher and status.

id: secure-mqtt-core
name: Secure MQTT Core
status: available
summary: Policies, audit trail, evidence chain, Web UI.
description: |
  The baseline TrailMQ stack: TLS MQTT broker on 8883, REST API, Web UI
  via reverse proxy, cryptographic audit chain, and policy-based access
  control. This is what you run when you want "secure, audited MQTT" and
  nothing more. Every other recipe builds on top of this one.

# Images used by this recipe.
# Pinned to the 3.1.0 release — env vars override at runtime.
# See .env.example for the recommended variables.
images:
  backend: rainergewalt/trailmq-backend:3.1.0
  frontend: rainergewalt/trailmq-frontend:3.1.0
  nginx: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0

# Capabilities enabled in this recipe.
features:
  core:
    tls: true
    audit_chain: true
    policy_enforcement: true
    rest_api: true
    web_ui: true
  plugins:
    decision_trace: false
    historical_context_feed: false
    kpi_lite: false
    domain_context: false

# Ports exposed to the host by default. Host ports can be changed through
# TRAILMQ_HTTP_PORT and TRAILMQ_MQTT_TLS_PORT.
# The proxy runs unprivileged and listens on 8080 inside its container; the host
# port is unchanged.
ports:
  - { host: 80,    container: 8080, service: nginx,   name: "HTTP / Web UI" }
  - { host: 8883,  container: 8883, service: backend, name: "MQTT over TLS" }
