# TrailMQ — Secure MQTT Core configuration
#
# This is the single configuration file for the recipe. It is mounted
# read-only into the backend container (see docker-compose.yaml).
# Paths are relative to this file (recipes/secure-mqtt-core/).
#
# Common edits:
#   users / roles         → "users:" and "roles:" below
#   queue behavior        → "queue_advanced:"
#   audit retention       → "audit_advanced:" and "audit_retention_days:"
#   browser/API origins   → "cors:" and "mqtt_ws_allowed_origins:"
#   log verbosity         → "log_level:"
#
# Host ports and image tags are NOT set here — use the root .env file
# (see .env.example). Credential examples live in docs/config-examples/users.yaml.

tls:
  server_cert: ./certs/server_cert.pem
  server_key: ./certs/server_key.pem
  ca_cert: ./certs/ca_cert.pem
  whitelist:
    - 0.0.0.0/0 # IPv4: all
    - ::/0      # IPv6: all (or minimal just ::1/128)
  enable_ocsp: true
  ocsp_fail_close: false
  rate_limit: 10
  allowed_ciphers: []
  client_auth_enabled: false
  min_version: "1.3"
  allow_tls12_fallback: false

mqtt_port: 8883
mqtt_use_tls: true
rest_port: 8443
rest_use_tls: false

# WebSocket configuration
mqtt_ws_port: 9001
mqtt_ws_use_tls: false
mqtt_wss_port: 9443
mqtt_ws_path: "/mqtt"
# Browser origins allowed to open the MQTT WebSocket.
# Add your own host/port here if you serve the Web UI from somewhere else.
mqtt_ws_allowed_origins:
  - "http://localhost"        # default HTTP port (80)
  - "http://localhost:8080"   # matches the TRAILMQ_HTTP_PORT=8080 example
  - "http://nginx"            # internal reverse proxy
mqtt_ws_max_connections: 1000
mqtt_ws_ping_interval: 60
mqtt_ws_read_limit: 1048576  # 1MB
mqtt_ws_write_limit: 1048576 # 1MB

queue_size: 100
audit_max_size: 500
db_path: ./data/mqtrail.db

jwtsecret_file: ./secrets/jwtsecret.txt

# Role permissions use the form "<action>:<mqtt-topic-filter>" where
# <action> is "publish" or "subscribe" and the filter is an MQTT-style
# pattern ("*" and "#" both mean all topics, e.g. "publish:demo/#").
# A bare "*" grants everything (admin).
#
# Note: a role permission alone is not enough to reach a topic. The
# broker ALSO checks the topic/namespace ACL: "public/#" is open to all
# known roles, "restricted/#" is admin-only, and every other namespace
# is deny-by-default until a topic grants roles via its
# accessControl/allowedRoles settings (REST or Web UI).
roles:
  - id: 1
    name: admin
    description: "Administrator role"
    permissions: ["*"]
  - id: 2
    name: publisher
    description: "Can publish messages"
    permissions: ["publish:*"]
  - id: 3
    name: viewer
    description: "Read-only user"
    permissions: ["subscribe:*"]
  - id: 4
    name: devops
    description: "Deployment / monitoring tasks"
    permissions: ["publish:metrics", "subscribe:alerts"]

# Active evaluation users only.
#
# Important:
# Keep documentation-only users out of this active list.
# The current backend validates password_file entries while loading config.
# A disabled user with a missing password_file can therefore stop startup.
#
# Credential examples are documented in:
#   docs/config-examples/users.yaml
#
# The launcher generates random passwords into these files on first run:
#   ./secrets/testadmin.pwd
#   ./secrets/testuser.pwd
users:
  - username: testadmin
    password_file: ./secrets/testadmin.pwd
    roles: [admin]
    email: ""
    enabled: true
    managed_by_config: true

  - username: testuser
    password_file: ./secrets/testuser.pwd
    roles: [publisher]
    email: ""
    enabled: true
    managed_by_config: true

export_dir: ./data/export

queue_advanced:
  dead_letter_enabled: true
  dead_letter_topic: dlq/error
  message_ttl_seconds: 3600
  batch_size: 100
  batch_timeout: 2
  max_batch_size_bytes: 1048576
  enable_priority_queue: true

audit_advanced:
  max_size: 10000
  auto_cleanup: true
  auto_export: false
  export_format: ""
  export_dir: ./data/audit_backup

dynamic_features:
  cert_rotation_enabled: true
  auto_topic_creation: true
  inactivity_threshold: "10m"
  topic_retention_period: "24h"

endpoint_rate_limits: []
anonymous_access: false
default_role: ""

# Cross-origin access to the REST API.
# Add your own host/port here if you call the API from another origin.
cors:
  allowed_origins:
    - http://localhost          # default HTTP port (80)
    - http://localhost:8080     # matches the TRAILMQ_HTTP_PORT=8080 example
    - http://nginx              # internal reverse proxy
    - http://localhost:5173     # local frontend dev server (Vite)
    - http://localhost:3000     # local frontend dev server
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Requested-With
  exposed_headers:
    - Content-Disposition
  allow_credentials: true

# User synchronization mode.
#
# "merge" creates/synchronizes configured users at backend startup, but a user
# already persisted in the runtime database is NOT revoked merely by removing
# that user's block above or deleting its password file. For safe offboarding,
# first remove the config declaration, then delete the runtime user through the
# REST API. See the repository guide: docs/access-management.md.
authsyncmode: "merge"
log_level: "info"
log_path: "logs"

audit_archive_path: "./audit-archive"
audit_retention_days: 90
