# TrailMQ — Secure MQTT Core
# Self-contained: all paths resolve relative to this file.
# Run from repo root via: ./trailmq start
# Or directly: cd recipes/secure-mqtt-core && docker compose up -d
#
# Image tags and host ports can be overridden via .env or environment variables:
#   TRAILMQ_BACKEND_IMAGE, TRAILMQ_FRONTEND_IMAGE, TRAILMQ_NGINX_IMAGE
#   TRAILMQ_HTTP_PORT, TRAILMQ_MQTT_TLS_PORT
#
# The defaults below stay on 3.0.0 because that is what is published. 3.1.0 is built
# and validated but not yet on Docker Hub, and a default naming a tag that does not
# exist remotely gives a first-time user a pull failure instead of a product. Move both
# defaults to 3.1.0 in the same change that publishes the images — not before.

networks:
  trailmq-net:
    driver: bridge

services:
  # ------------------------------------------------------------
  # TrailMQ Backend
  # ------------------------------------------------------------
  backend:
    image: ${TRAILMQ_BACKEND_IMAGE:-rainergewalt/trailmq-backend:3.0.0}
    container_name: trailmq-backend
    restart: unless-stopped
    ports:
      - "${TRAILMQ_MQTT_TLS_PORT:-8883}:8883"  # MQTT TLS external
    expose:
      - "8443"               # REST API (internal)
      - "9001"               # MQTT WebSocket (internal)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audit-archive:/app/audit-archive
      - ./certs:/app/certs:ro
      - ./secrets:/app/secrets:ro
    environment:
      GO_ENV: production
    networks:
      - trailmq-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ------------------------------------------------------------
  # TrailMQ Frontend
  # ------------------------------------------------------------
  frontend:
    image: ${TRAILMQ_FRONTEND_IMAGE:-rainergewalt/trailmq-frontend:3.0.0}
    container_name: trailmq-frontend
    restart: unless-stopped
    expose:
      - "8080"          # 3.x image serves on 8080 (non-root nginx)
    depends_on:
      - backend
    networks:
      - trailmq-net

  # ------------------------------------------------------------
  # Reverse Proxy
  # ------------------------------------------------------------
  nginx:
    image: ${TRAILMQ_NGINX_IMAGE:-nginx:stable-alpine}
    container_name: trailmq-reverse-proxy
    restart: unless-stopped
    ports:
      - "${TRAILMQ_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - trailmq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
