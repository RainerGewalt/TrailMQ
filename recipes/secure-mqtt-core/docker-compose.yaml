# TrailMQ — Secure MQTT Core
# Self-contained: all paths resolve relative to this file.
# Run from repo root via: ./trailmq start
# Or directly: cd recipes/secure-mqtt-core && docker compose up -d
#
# Image tags and host ports can be overridden via .env or environment variables:
#   TRAILMQ_BACKEND_IMAGE, TRAILMQ_FRONTEND_IMAGE, TRAILMQ_NGINX_IMAGE
#   TRAILMQ_HTTP_PORT, TRAILMQ_MQTT_TLS_PORT
#
# The defaults below name 3.1.0, which is published on Docker Hub and GHCR and
# signed. A default must never name a tag that does not exist remotely — that gives
# a first-time user a pull failure instead of a product — so these move only in step
# with publication, which is what happened here.

networks:
  trailmq-net:
    driver: bridge

services:
  # ------------------------------------------------------------
  # TrailMQ Backend
  # ------------------------------------------------------------
  backend:
    image: ${TRAILMQ_BACKEND_IMAGE:-rainergewalt/trailmq-backend:3.1.0}
    container_name: trailmq-backend
    restart: unless-stopped
    ports:
      - "${TRAILMQ_MQTT_TLS_PORT:-8883}:8883"  # MQTT TLS external
    expose:
      - "8443"               # REST API (internal)
      - "9001"               # MQTT WebSocket (internal)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audit-archive:/app/audit-archive
      - ./certs:/app/certs:ro
      - ./secrets:/app/secrets:ro
    environment:
      GO_ENV: production
    networks:
      - trailmq-net
    # The backend writes only into the mounted volumes below, so the image's own
    # filesystem can stay read-only. /tmp is the one exception a Go process needs.
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ------------------------------------------------------------
  # TrailMQ Frontend
  # ------------------------------------------------------------
  frontend:
    image: ${TRAILMQ_FRONTEND_IMAGE:-rainergewalt/trailmq-frontend:3.1.0}
    container_name: trailmq-frontend
    restart: unless-stopped
    expose:
      - "8080"          # 3.x image serves on 8080 (non-root nginx)
    depends_on:
      - backend
    networks:
      - trailmq-net
    # The image already writes its pid and nginx temp paths under /tmp and sends
    # both logs to stdout/stderr, so nothing outside /tmp needs to be writable.
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ------------------------------------------------------------
  # Reverse Proxy
  # ------------------------------------------------------------
  nginx:
    # Unprivileged nginx: runs as uid 101 and listens on 8080 inside the container,
    # so the proxy needs neither root nor a capability to bind its port. The host
    # port you reach it on is unchanged — only the container side moved.
    # Pinned by digest so the proxy cannot change under a rebuild. The digest is a
    # multi-arch index (amd64, arm64, armv6/v7, 386, ppc64le, riscv64, s390x).
    image: ${TRAILMQ_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0}
    container_name: trailmq-reverse-proxy
    restart: unless-stopped
    ports:
      - "${TRAILMQ_HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - trailmq-net
    # nginx.conf keeps the pid file and every proxy temp path under /tmp and logs to
    # stdout/stderr, so nothing outside /tmp needs to be writable.
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
